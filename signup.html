<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Registration · DevCore Studios</title>
    <link rel="icon" href="DevCore_official.png" type="image/png">
    <!-- GSAP for Smooth Entrance Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <!-- REGISTRATION CARD -->
    <div class="register-container">
        <div class="register-header">
            <div class="brand-icon">D</div>
            <h1>Profile Registration</h1>
            <p>Create your account to access telemetry and workspace support.</p>
        </div>

        <form id="registrationForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g., user@example.com" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+91 98765 43210" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Verify your password" required>
            </div>

            <button type="submit" class="btn-submit">Register Profile ↗</button>
        </form>

        <div class="divider">or</div>

        <!-- Sign up with Google Option -->
        <button type="button" class="btn-google" onclick="window.location.href='/oauth2/authorization/google'">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.7 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.1L1.6 16C3.5 19.8 7.4 23 12 23z"/></svg>
            Sign up with Google
        </button>

        <div class="register-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>
     <script src="signup.js"></script>
    <script src="api.js"></script>
</body>
</html>

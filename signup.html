<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Registration · DevCore Studios</title>
    <link rel="icon" href="DevCore_official.png" type="image/png">
    <!-- GSAP for Smooth Entrance Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --ink: #f8f6fc;
            --violet: #9b5cff;
            --magenta: #d84bb4;
            --bg-dark: #0a0711;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(155, 92, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(216, 75, 180, 0.12) 0%, transparent 40%);
        }

        /* Registration Container Card */
        .register-container {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            border-radius: 24px;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(5, 3, 11, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            margin-top: 100px;
            margin-bottom: 40px;
            box-sizing: border-box;
            opacity: 0;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header .brand-icon {
            display: inline-grid;
            place-items: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--magenta));
            color: white;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(155, 92, 255, 0.4);
            margin-bottom: 15px;
        }

        .register-header h1 {
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            font-weight: 800;
        }

        .register-header p {
            color: #b4adc9;
            font-size: 0.9rem;
            margin: 0;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b4adc9;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(10, 7, 17, 0.6);
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--violet), var(--magenta));
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(155, 92, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(155, 92, 255, 0.6);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #8b82a2;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }

        .btn-google {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .register-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.85rem;
            color: #b4adc9;
        }

        .register-footer a {
            color: var(--violet);
            text-decoration: none;
            font-weight: 700;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- REGISTRATION CARD -->
    <div class="register-container">
        <div class="register-header">
            <div class="brand-icon">D</div>
            <h1>Profile Registration</h1>
            <p>Create your account to access telemetry and workspace support.</p>
        </div>

        <form id="registrationForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a username" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g., user@example.com" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+91 98765 43210" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Verify your password" required>
            </div>

            <button type="submit" class="btn-submit">Register Profile ↗</button>
        </form>

        <div class="divider">or</div>

        <!-- Sign up with Google Option -->
        <button type="button" class="btn-google" onclick="window.location.href='/oauth2/authorization/google'">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.7 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.1L1.6 16C3.5 19.8 7.4 23 12 23z"/></svg>
            Sign up with Google
        </button>

        <div class="register-footer">
            Already have an account? <a href="login.html">Sign in here</a>
        </div>
    </div>

    <!-- GSAP Entrance Animation Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.to(".register-container", {
                opacity: 1,
                y: 0,
                duration: 0.8,
                ease: "power3.out",
                startAt: { y: 30, opacity: 0 }
            });

            // Form Submit Hook (Ready for your Java backend integration)
            document.getElementById("registrationForm").addEventListener("submit", (e) => {
                e.preventDefault();
                const username = document.getElementById("username").value.trim();
                const pass = document.getElementById("password").value;
                const confirmPass = document.getElementById("confirmPassword").value;

                if (pass !== confirmPass) {
                    alert("Passwords do not match. Please verify.");
                    return;
                }

                if (username) {
                    localStorage.setItem("devcoreActiveSession", username);
                    gsap.to(".register-container", { scale: 0.98, opacity: 0, duration: 0.3, onComplete: () => {
                        window.location.href = "index.html";
                    }});
                }
            });
        });
    </script>
    <script src="api.js"></script>
</body>
</html>

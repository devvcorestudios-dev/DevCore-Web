<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · DevCore Studios</title>
    <link rel="stylesheet" href="login.css">
   
</head>
<body>

    <!-- TOP NAVBAR PILL -->
    <nav aria-label="Primary navigation">
        <a href="index.html" class="logo"><span>D</span>devcore</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#work">Templates</a>
            <a href="index.html#work">Projects</a>
        </div>
    </nav>

    <!-- SIGN-IN CARD -->
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to access your DevCore workspace & client telemetry dashboard.</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="developerName">Developer / Client Name</label>
                <input type="text" id="developerName" placeholder="e.g. Avinash Vyas" required>
            </div>

            <div class="input-group">
                <label for="password">Password Key</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Authenticate Session ↗</button>
        </form>

        <div class="login-footer">
            Don't have an active workspace? <a href="signup.html">New Account</a>
        </div>
    </div>

  <script src="login.js"></script>
  <script src="api.js"></script>
  <script src="auth.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · DevCore Studios</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ==========================================================================
           SIGN-IN PAGE SPECIFIC STYLING (Matching DevCore Theme)
           ========================================================================== */
        :root {
            --ink: #f8f6fc;
            --violet: #9b5cff;
            --magenta: #d84bb4;
            --bg-dark: #0a0711;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(155, 92, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(216, 75, 180, 0.1) 0%, transparent 40%);
        }

        /* Re-using your exact nav styles */
        nav { 
            position: fixed; 
            z-index: 20; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            align-items: center; 
            min-height: 58px; 
            padding: 6px; 
            border: 1px solid rgba(255,255,255,.2); 
            border-radius: 999px; 
            background: linear-gradient(120deg,rgba(255,255,255,.16),rgba(255,255,255,.055)); 
            box-shadow: 0 12px 35px rgba(5,3,11,.34), inset 0 1px 0 rgba(255,255,255,.22); 
            backdrop-filter: blur(20px) saturate(150%); 
            -webkit-backdrop-filter: blur(20px) saturate(150%); 
        }
        .logo { font-weight:800; letter-spacing:-1.4px; font-size:22px; text-decoration:none; color:var(--ink); padding: 0 15px; display: flex; align-items: center; }
        .logo span { display:inline-grid; place-items:center; width:21px; height:21px; margin-right:5px; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--magenta)); color:white; font-size:13px; box-shadow:0 5px 16px rgba(155,92,255,.35); }
        .nav-links { display:flex; gap:3px; align-items:center; padding-right: 5px; }
        .nav-links a { color:#ded9e7; text-decoration:none; font-size:12px; font-weight:700; padding:12px 17px; border-radius:999px; transition:background .25s,color .25s,box-shadow .25s; }
        .nav-links a:hover, .nav-links a:focus-visible, .nav-links .active { background:linear-gradient(135deg,rgba(155,92,255,.82),rgba(216,75,180,.78)); color:white; box-shadow:0 5px 16px rgba(155,92,255,.3); outline:none; }

        /* Login Container Card */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 24px;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(5, 3, 11, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            margin-top: 80px;
        }

        .login-header h1 {
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .login-header p {
            color: #b4adc9;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b4adc9;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(10, 7, 17, 0.6);
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--violet), var(--magenta));
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(155, 92, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(155, 92, 255, 0.6);
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #b4adc9;
        }

        .login-footer a {
            color: var(--violet);
            text-decoration: none;
            font-weight: 700;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- TOP NAVBAR PILL -->
    <nav aria-label="Primary navigation">
        <a href="index.html" class="logo"><span>D</span>devcore</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#work">Templates</a>
            <a href="index.html#work">Projects</a>
        </div>
    </nav>

    <!-- SIGN-IN CARD -->
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to access your DevCore workspace & client telemetry dashboard.</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="developerName">Developer / Client Name</label>
                <input type="text" id="developerName" placeholder="e.g. Avinash Vyas" required>
            </div>

            <div class="input-group">
                <label for="password">Password Key</label>
                <input type="password" id="password" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Authenticate Session ↗</button>
        </form>

        <div class="login-footer">
            Don't have an active workspace? <a href="mailto:hello@devcore.studio">Request access</a>
        </div>
    </div>

    <!-- SCRIPT TO SIMULATE LOGIN SESSION -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const nameInput = document.getElementById("developerName").value.trim();
            
            if (nameInput) {
                // Set the session key that auth.js checks for
                localStorage.setItem("devcoreActiveSession", nameInput);
                // Redirect back to main page
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
